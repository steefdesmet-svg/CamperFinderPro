name: Bouw en publiceer CamperFinder Pro 1.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Java 17 instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle instellen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 installeren
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: APK bouwen
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK hernoemen
        run: cp app/build/outputs/apk/debug/app-debug.apk CamperFinderPro-1.0.apk

      - name: APK als tijdelijk artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: CamperFinderPro-1.0
          path: CamperFinderPro-1.0.apk
          if-no-files-found: error

      - name: Bestaande versie 1.0 verwijderen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0 --cleanup-tag --yes || true

      - name: Installatiebestand publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 CamperFinderPro-1.0.apk \
            --title 'CamperFinder Pro 1.0' \
            --notes 'Kant-en-klare Android APK. Download CamperFinderPro-1.0.apk op uw tablet en tik erop om te installeren.'
